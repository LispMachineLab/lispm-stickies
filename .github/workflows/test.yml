name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # LispM UI, which asks before a note is thrown away.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          path: .deps/lispm-ui
      # LispM Kit, whose engine translates LispM UI's words.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kit
          path: .deps/lispm-kit
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: make test compile LISPM_UI=.deps/lispm-ui LISPM_KIT=.deps/lispm-kit
